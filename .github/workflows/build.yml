name: Compilar

# Verifica que la web compile en cada PR (no publica nada).
on:
  pull_request:
    paths: ["web/**", "scrape_global.py", ".github/workflows/**"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: web
      - run: python3 web/scripts/prepare_data.py
      - run: npm run build
        working-directory: web
